<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8B7BFF">
  <meta name="description" content="Search and play your Wacky Games collection.">
  <title>Wacky Games</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238B7BFF'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='23'%3EW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="games.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" href="./" aria-label="Wacky Games home" title="Wacky Games">W</a>
    <button class="nav-game" aria-label="Games" aria-current="page" title="Games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
  </aside>
  <main id="catalog">
    <h1 id="page-title" class="sr-only">All games</h1>
    <header class="search-area">
      <label class="search-wrap">
        <span class="sr-only">Search games</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="Search games…" autocomplete="off" spellcheck="false">
      </label>
      <nav class="collection-nav" aria-label="Game collections"><a href="#all" data-view="all" aria-current="page">All</a><a href="#favorites" data-view="favorites">Favorites</a><a href="#recents" data-view="recents">Recents</a></nav><p id="result-count" class="sr-only" role="status" aria-live="polite"></p>
    </header>
    <p id="storage-notice" class="storage-notice" role="status" hidden>Your browser could not read or save your lists. Changes may last only until you close this page.</p><section id="game-grid" class="game-grid" aria-label="Games"></section>
    <p id="empty" class="empty" hidden>No games found. Try another name.</p>
    <noscript><p class="empty">Enable JavaScript to search and play games.</p></noscript>
  </main>
  <dialog id="player" aria-labelledby="game-title">
    <header class="player-bar">
      <h2 id="game-title"></h2>
      <div class="player-actions">
        <button id="favorite" type="button" aria-pressed="false">Favorite</button><button id="reload" type="button" title="Restart this game">Reload</button>
        <button id="fullscreen" type="button">Fullscreen</button>
        <button id="close" type="button" aria-label="Close game">Close</button>
      </div>
    </header>
    <p id="player-storage-notice" class="storage-notice" role="status" hidden>Your browser could not save your lists. Changes may last only until you close this page.</p><p id="player-status" role="status" hidden></p>
    <div id="game-stage"></div>
  </dialog>
</body>
</html>
