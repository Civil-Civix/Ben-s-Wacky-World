<!DOCTYPE html>
  <head><script id="wacky-ad-guard">/* Wacky World: suppress known ad hosts and popup windows in this game document. */
(() => {
  const adHost = /(^|\.)(googlesyndication\.com|doubleclick\.net|googleadservices\.com|adservice\.google\.[a-z.]+|adsterra\.com|monetag\.com|breadisgay\.eduplace\.net|popads\.net|popcash\.net|adnxs\.com|adsrvr\.org|adinplay\.com)$/i;
  const isAd = value => {try{return adHost.test(new URL(String(value),document.baseURI).hostname);}catch{return false;}};
  const selector = '[id^="sidebarad"],iframe.sidebar-frame,ins.adsbygoogle,iframe[id^="google_ads"],iframe[id^="aswift_"],[data-ad-client][data-ad-slot]';
  const clean = node => {
    if(node.nodeType!==1)return false;
    if(node.matches(selector) || (['SCRIPT','IFRAME'].includes(node.tagName) && isAd(node.src))) {
      node.remove();return true;
    }
    node.querySelectorAll(selector).forEach(el=>el.remove());
    return false;
  };
  const originalAppend=Node.prototype.appendChild, originalInsert=Node.prototype.insertBefore;
  Node.prototype.appendChild=function(node){if(clean(node))return node;return originalAppend.call(this,node);};
  Node.prototype.insertBefore=function(node,ref){if(clean(node))return node;return originalInsert.call(this,node,ref);};
  new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(clean))).observe(document.documentElement,{childList:true,subtree:true});
  const originalFetch=window.fetch;
  if(originalFetch)window.fetch=function(input,...args){if(isAd(input?.url||input))return Promise.reject(new TypeError('Advertisement blocked'));return originalFetch.call(this,input,...args);};
  const originalOpen=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(method,url,...args){return originalOpen.call(this,method,isAd(url)?'data:text/plain,':url,...args);};
  const queue=[];
  queue.push=function(options){queueMicrotask(()=>{
    if(!options||typeof options!=='object')return;
    try{options.beforeAd?.();options.afterAd?.();options.adBreakDone?.({breakStatus:'noAdPreloaded'});}catch(_){}
  });return 0;};
  try{Object.defineProperty(window,'adsbygoogle',{get:()=>queue,set:()=>{},configurable:false});}catch(_){}
  window.open=()=>({closed:true,focus(){},close(){},location:{}});
})();</script>
    <script>
      window.gameconfig = {
        name: "Phoenix Wright - Ace Attorney (USA)",
        url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@e27ad66eda838f123bfb1aff7958bbda703283f5/Phoenix%20Wright%20-%20Ace%20Attorney%20(USA)/Phoenix%20Wright%20-%20Ace%20Attorney%20(USA).nds",
        core: "nds",
        min: 1,
        max: 4,
      };
    </script>
    <script>
      function mergeFiles(fileParts, cb) {
        return new Promise((resolve, reject) => {
          let buffers = [];
          function fetchPart(index) {
            if (index >= fileParts.length) {
              let mergedBlob = new Blob(buffers);
              let mergedFileUrl = URL.createObjectURL(mergedBlob);
              resolve(mergedFileUrl);
              return;
            }
            fetch(fileParts[index])
              .then((response) => response.arrayBuffer())
              .then((data) => {
                buffers.push(data);
                fetchPart(index + 1);
              })
              .catch(reject);
            cb(index);
          }
          fetchPart(0);
        });
      }
      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          let padded = String(i).padStart((end+"").length, '0');
          parts.push(file + ".part" + padded);
        }
        return parts;
      }
getParts("asd.js", 0, 100)
    </script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }
      #game-container {
        text-align: center;
        width: 100%;
        height: 100%;
      }
      #loading-progress {
        font-size: 18px;
        margin-top: 20px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="game"></div>
      <div id="loading-progress">Loading: 0/0</div>
      <div id="first-time">First-time loading may take longer...</div>
    </div>
    <script>
      var parts = getParts(
        window.gameconfig.url,
        window.gameconfig.min,
        window.gameconfig.max
      );
      var totalParts = parts.length;

      function updateLoadingProgress(loaded) {
        const progressElement = document.getElementById("loading-progress");
        if (loaded === 0) {
          progressElement.textContent = "Loading: 0/0";
        } else {
          progressElement.textContent = `Loading: ${loaded}/${totalParts}`;
        }
      }

      Promise.all([mergeFiles(parts, updateLoadingProgress)])
        .then(([gameUrl]) => {
          document.getElementById("loading-progress").remove();
          document.getElementById("first-time").remove();
          EJS_player = "#game";
          EJS_core = window.gameconfig.core;
          EJS_gameName = window.gameconfig.name;
          EJS_color = "#0064ff";
          EJS_startOnLoaded = true;
          EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
          EJS_gameUrl = gameUrl;
          const script = document.createElement("script");
          script.src =
            "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
          document.body.appendChild(script);
        })
        .catch((error) => {
          console.error(error);
          document.getElementById("loading-progress").textContent =
            "Error loading game.";
        });
    </script>
  </body>

</html>
