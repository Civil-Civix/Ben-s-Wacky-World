<script id="wacky-ad-guard">/* Wacky World: suppress known ad hosts and popup windows in this game document. */
(() => {
  const adHost = /(^|\.)(googlesyndication\.com|doubleclick\.net|googleadservices\.com|adservice\.google\.[a-z.]+|adsterra\.com|monetag\.com|breadisgay\.eduplace\.net|popads\.net|popcash\.net|adnxs\.com|adsrvr\.org|adinplay\.com)$/i;
  const isAd = value => {try{return adHost.test(new URL(String(value),document.baseURI).hostname);}catch{return false;}};
  const selector = '[id^="sidebarad"],iframe.sidebar-frame,ins.adsbygoogle,iframe[id^="google_ads"],iframe[id^="aswift_"],[data-ad-client][data-ad-slot]';
  const clean = node => {
    if(node.nodeType!==1)return false;
    if(node.matches(selector) || (['SCRIPT','IFRAME'].includes(node.tagName) && isAd(node.src))) {
      node.remove();return true;
    }
    node.querySelectorAll(selector).forEach(el=>el.remove());
    return false;
  };
  const originalAppend=Node.prototype.appendChild, originalInsert=Node.prototype.insertBefore;
  Node.prototype.appendChild=function(node){if(clean(node))return node;return originalAppend.call(this,node);};
  Node.prototype.insertBefore=function(node,ref){if(clean(node))return node;return originalInsert.call(this,node,ref);};
  new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(clean))).observe(document.documentElement,{childList:true,subtree:true});
  const originalFetch=window.fetch;
  if(originalFetch)window.fetch=function(input,...args){if(isAd(input?.url||input))return Promise.reject(new TypeError('Advertisement blocked'));return originalFetch.call(this,input,...args);};
  const originalOpen=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(method,url,...args){return originalOpen.call(this,method,isAd(url)?'data:text/plain,':url,...args);};
  const queue=[];
  queue.push=function(options){queueMicrotask(()=>{
    if(!options||typeof options!=='object')return;
    try{options.beforeAd?.();options.afterAd?.();options.adBreakDone?.({breakStatus:'noAdPreloaded'});}catch(_){}
  });return 0;};
  try{Object.defineProperty(window,'adsbygoogle',{get:()=>queue,set:()=>{},configurable:false});}catch(_){}
  window.open=()=>({closed:true,focus(){},close(){},location:{}});
})();</script><!-- Ultimate Game Stash file-->

    <script>
        window.config = {
            loader: "unity",
            debug: false,
            maxRatio: 16 / 9,
            minRatio: 9 / 16,
            title: 'Subway Surfers: Miami',
            unityVersion: '2019.4.18f1',
            unityWebglBuildUrl: 'subway_miami_v1.json',
            fileSize: 31,
            cachedDecompressedFileSizes: {
                'subway_miami_v1.wasm.framework.unityweb':425811,
                'subway_miami_v1.asm.framework.unityweb':444038,
                'subway_miami_v1.asm.memory.unityweb':2703865,
                'subway_miami_v1.wasm.code.unityweb':21971555,
                'subway_miami_v1.data.unityweb':34189276,
                'subway_miami_v1.asm.code.unityweb':55509105,
            },
        };
        window.mergedBlobUrls = {};
        window.assetsReady = false;

        async function mergeSplitFile(fileUrlBase, numParts = 2) {
            const partUrls = Array.from({ length: numParts }, (_, i) => 
                `${fileUrlBase}.part${i + 1}`
            );

            try {
                const responses = await Promise.all(
                    partUrls.map(url => fetch(url))
                );

                if (responses.some(r => !r.ok)) {
                    return null;
                }

                const parts = await Promise.all(
                    responses.map(r => r.arrayBuffer())
                );

                const combinedBlob = new Blob(parts, {
                    type: 'application/octet-stream'
                });

                return URL.createObjectURL(combinedBlob);
            } catch (error) {
                return null;
            }
        }

        function setupXHRInterceptor() {
            if (window.xhrInterceptorInstalled) {
                return;
            }
            
            const originalOpen = XMLHttpRequest.prototype.open;
            const originalSend = XMLHttpRequest.prototype.send;

            XMLHttpRequest.prototype.open = function(method, url, ...args) {
                this._url = url;
                this._method = method;
                this._args = args;
                
                let finalUrl = url;
                for (const [filename, blobUrl] of Object.entries(window.mergedBlobUrls)) {
                    if (url.includes(filename)) {
                        finalUrl = blobUrl;
                        break;
                    }
                }
                
                return originalOpen.call(this, method, finalUrl, ...args);
            };

            XMLHttpRequest.prototype.send = function(...args) {
                const xhr = this;
                
                if (!window.assetsReady) {
                    const checkReady = setInterval(() => { 
                        if (window.assetsReady) {
                            clearInterval(checkReady);
                            originalSend.apply(xhr, args);
                        }
                    }, 50);
                    return;
                }
                
                return originalSend.apply(this, args);
            };
            
            window.xhrInterceptorInstalled = true;
        }

        async function prepareGameAssets() {
            try {
                window.assetsReady = false;
                delete window.xhrInterceptorInstalled;
                window.mergedBlobUrls = {};
                
                setupXHRInterceptor();
                
                const filesToMerge = [
                    'subway_miami_v1.data.unityweb',
                    'subway_miami_v1.wasm.code.unityweb'
                ];
                 
                for (const filename of filesToMerge) {
                    const blobUrl = await mergeSplitFile(filename, 2);
                    if (blobUrl) {
                        window.mergedBlobUrls[filename] = blobUrl;
                    } 
                }
                
                window.assetsPrepared = true;
                window.assetsReady = true;
                
            } catch (error) {
                window.assetsPrepared = false;
                window.assetsReady = true;
            }
        }

        prepareGameAssets();

    </script>
