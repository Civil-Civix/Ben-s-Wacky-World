<head><script id="wacky-ad-guard">/* Wacky World: suppress known ad hosts and popup windows in this game document. */
(() => {
  const adHost = /(^|\.)(googlesyndication\.com|doubleclick\.net|googleadservices\.com|adservice\.google\.[a-z.]+|adsterra\.com|monetag\.com|breadisgay\.eduplace\.net|popads\.net|popcash\.net|adnxs\.com|adsrvr\.org|adinplay\.com)$/i;
  const isAd = value => {try{return adHost.test(new URL(String(value),document.baseURI).hostname);}catch{return false;}};
  const selector = '[id^="sidebarad"],iframe.sidebar-frame,ins.adsbygoogle,iframe[id^="google_ads"],iframe[id^="aswift_"],[data-ad-client][data-ad-slot]';
  const clean = node => {
    if(node.nodeType!==1)return false;
    if(node.matches(selector) || (['SCRIPT','IFRAME'].includes(node.tagName) && isAd(node.src))) {
      node.remove();return true;
    }
    node.querySelectorAll(selector).forEach(el=>el.remove());
    return false;
  };
  const originalAppend=Node.prototype.appendChild, originalInsert=Node.prototype.insertBefore;
  Node.prototype.appendChild=function(node){if(clean(node))return node;return originalAppend.call(this,node);};
  Node.prototype.insertBefore=function(node,ref){if(clean(node))return node;return originalInsert.call(this,node,ref);};
  new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(clean))).observe(document.documentElement,{childList:true,subtree:true});
  const originalFetch=window.fetch;
  if(originalFetch)window.fetch=function(input,...args){if(isAd(input?.url||input))return Promise.reject(new TypeError('Advertisement blocked'));return originalFetch.call(this,input,...args);};
  const originalOpen=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(method,url,...args){return originalOpen.call(this,method,isAd(url)?'data:text/plain,':url,...args);};
  const queue=[];
  queue.push=function(options){queueMicrotask(()=>{
    if(!options||typeof options!=='object')return;
    try{options.beforeAd?.();options.afterAd?.();options.adBreakDone?.({breakStatus:'noAdPreloaded'});}catch(_){}
  });return 0;};
  try{Object.defineProperty(window,'adsbygoogle',{get:()=>queue,set:()=>{},configurable:false});}catch(_){}
  window.open=()=>({closed:true,focus(){},close(){},location:{}});
})();</script>

    function InitApi(_appId) {
      var dateNow = new Date();
      var secondsSinceEpoch = Math.round(dateNow.getTime() / 1000);

      console.log('InitApi');

      window.callTime = secondsSinceEpoch - 121;
    }

    function InitExternEval(_appId) {
      console.log("InitExternEval");

      ExternEval();
    }

    function ExternEval() {
      console.log("ExternEval");

      var dateNow = new Date();
      var secondsSinceEpoch = Math.round(dateNow.getTime() / 1000);

      if (window.callTime != undefined &&
        secondsSinceEpoch - window.callTime > 120) {
        console.log('ExternEval 2');

        window.callTime = secondsSinceEpoch;

        if (typeof preroll !== 'undefined') {
          if (window[preroll.config.loaderObjectName] != undefined) {
            gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onOpen');

            try {
              window[preroll.config.loaderObjectName].refetchAd(ExternEvalResumeGame);
            } catch (err) {
              console.log(err.message);
              gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose');
            }
          }
        }
      }

    }

    function ExternEvalResumeGame() {
      console.log("ExternEvalResumeGame");

      gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose');
    }

    function PreloadRewarded() {
      console.log("PreloadRewarded");

      if (window.rewardedCallbacks == undefined) {
        window.rewardedCallbacks = true;

        try {
          window[window.preroll.config.loaderObjectName].registerRewardCallbacks({
            onReady: RewardedReady,
            onSuccess: RewardedSuccess,
            onFail: RewardedFail,
            onClose: RewardedClose
          });
        } catch (err) {
          console.log(err.message);
        }
      }
    }

    function ShowRewarded() {
      console.log("ShowRewarded");

      if (typeof preroll !== 'undefined') {
        if (window.rewardedCallbacks == undefined) {
          PreloadRewarded();
        }

        if (window[preroll.config.loaderObjectName] != undefined) {
          gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onOpen');

          try {
            window[preroll.config.loaderObjectName].showRewardAd();
          } catch (err) {
            console.log(err.message);
            gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose');
          }
        }
      }

    }

    function RewardedReady() {
      console.log("RewardedReady");

      if (window.rewardedCount == undefined) {
        window.rewardedCount = 1;
        window.gameInstance.SendMessage('FreezeNovaAPI', 'RewardedReady');
      } else {
        window.rewardedCount = window.rewardedCount + 1;
        //setTimeout(function(){ window.gameInstance.SendMessage('FreezeNovaAPI', 'RewardedReady'); }, 30000);
        window.gameInstance.SendMessage('FreezeNovaAPI', 'RewardedReady');
      }

    }

    function RewardedSuccess() {

      gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'RewardedOnFail');

    }

    function RewardedClose() {
      console.log("RewardedClose");
      gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose');
    }

  <script>
    function FitScreen() {
      var w = window.innerWidth;
      var h = window.innerHeight;

      var availWidth = window.innerWidth;
      var availHeight = window.innerHeight;

      var canvas = document.getElementById("#canvas");
      if (availWidth / availHeight > w / h) {
        height = availHeight;
        width = (height * w / h);
      } else {
        width = availWidth;
        height = width * h / w;
      }

      //canvas.width = width;
      //canvas.height = height;

      document.getElementById("gameContainer").style.width = width + "px";
      document.getElementById("gameContainer").style.height = height + "px";

    }

    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/game.json", {
      onProgress: UnityProgress
    });
