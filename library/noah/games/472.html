<!DOCTYPE html>
<html lang="en-us">
<head><script id="wacky-ad-guard">/* Wacky World: suppress known ad hosts and popup windows in this game document. */
(() => {
  const adHost = /(^|\.)(googlesyndication\.com|doubleclick\.net|googleadservices\.com|adservice\.google\.[a-z.]+|adsterra\.com|monetag\.com|breadisgay\.eduplace\.net|popads\.net|popcash\.net|adnxs\.com|adsrvr\.org|adinplay\.com)$/i;
  const isAd = value => {try{return adHost.test(new URL(String(value),document.baseURI).hostname);}catch{return false;}};
  const selector = '[id^="sidebarad"],iframe.sidebar-frame,ins.adsbygoogle,iframe[id^="google_ads"],iframe[id^="aswift_"],[data-ad-client][data-ad-slot]';
  const clean = node => {
    if(node.nodeType!==1)return false;
    if(node.matches(selector) || (['SCRIPT','IFRAME'].includes(node.tagName) && isAd(node.src))) {
      node.remove();return true;
    }
    node.querySelectorAll(selector).forEach(el=>el.remove());
    return false;
  };
  const originalAppend=Node.prototype.appendChild, originalInsert=Node.prototype.insertBefore;
  Node.prototype.appendChild=function(node){if(clean(node))return node;return originalAppend.call(this,node);};
  Node.prototype.insertBefore=function(node,ref){if(clean(node))return node;return originalInsert.call(this,node,ref);};
  new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(clean))).observe(document.documentElement,{childList:true,subtree:true});
  const originalFetch=window.fetch;
  if(originalFetch)window.fetch=function(input,...args){if(isAd(input?.url||input))return Promise.reject(new TypeError('Advertisement blocked'));return originalFetch.call(this,input,...args);};
  const originalOpen=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(method,url,...args){return originalOpen.call(this,method,isAd(url)?'data:text/plain,':url,...args);};
  const queue=[];
  queue.push=function(options){queueMicrotask(()=>{
    if(!options||typeof options!=='object')return;
    try{options.beforeAd?.();options.afterAd?.();options.adBreakDone?.({breakStatus:'noAdPreloaded'});}catch(_){}
  });return 0;};
  try{Object.defineProperty(window,'adsbygoogle',{get:()=>queue,set:()=>{},configurable:false});}catch(_){}
  window.open=()=>({closed:true,focus(){},close(){},location:{}});
})();</script>
<meta charset="utf-8">
<title>Trombone Champ</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#unityContainer{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000}
#unityContainer canvas{display:block;width:100%!important;height:100%!important;outline:none}
</style>
</head>
<body>
<div id="unityContainer"></div>
<script>
(function(){
  var BASE = 'https://cdn.jsdelivr.net/gh/wasmdotrip/wasm.rip@main/files/tchamp/Build/';
  var CHUNKED = {
    'web.data.unityweb': 6,
    'web.wasm.code.unityweb': 4
  };
  var blobUrls = {};
  var blobReady = false;

  function fetchArrayBuffer(url){
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status+' '+url);
      return r.arrayBuffer();
    });
  }

  function buildChunkedBlob(baseName, count){
    var parts = [];
    for(var i=0; i<count; i++){
      var padded = i < 10 ? '0' + i : '' + i;
      parts.push(BASE + baseName + padded);
    }
    return Promise.all(parts.map(fetchArrayBuffer))
      .then(function(bufs){
        return URL.createObjectURL(new Blob(bufs, {type:'application/octet-stream'}));
      });
  }

  // First, build all chunk blobs
  var jobs = Object.keys(CHUNKED).map(function(k){
    return buildChunkedBlob(k, CHUNKED[k]).then(function(u){ blobUrls[k] = u; });
  });

  Promise.all(jobs).then(function(){
    blobReady = true;

    // Now intercept ALL XHR and fetch requests
    var origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url){
      var args = Array.prototype.slice.call(arguments);
      // If it's a request for the merged file, redirect to blob URL
      if (typeof url === 'string') {
        for (var key in CHUNKED) {
          if (url.indexOf(key) !== -1 && blobUrls[key]) {
            args[1] = blobUrls[key];
            break;
          }
        }
      }
      return origOpen.apply(this, args);
    };

    var origFetch = window.fetch;
    window.fetch = function(input, init){
      if (typeof input === 'string') {
        for (var key in CHUNKED) {
          if (input.indexOf(key) !== -1 && blobUrls[key]) {
            input = blobUrls[key];
            break;
          }
        }
      } else if (input && input.url) {
        var ru = input.url;
        for (var key in CHUNKED) {
          if (ru.indexOf(key) !== -1 && blobUrls[key]) {
            ru = blobUrls[key];
            break;
          }
        }
        if (ru !== input.url) input = new Request(ru, input);
      }
      return origFetch.call(this, input, init);
    };

    // Load UnityLoader.js
    var s = document.createElement('script');
    s.src = BASE + 'UnityLoader.js';
    s.onload = function(){
      // The Unity loader is now loaded, but its internal XHR will be intercepted
      // by our patched open() above. So we can just instantiate normally.
      UnityLoader.instantiate('unityContainer', BASE + 'web.json');
    };
    document.head.appendChild(s);
  }).catch(function(e){
    document.body.innerHTML += '<pre style="color:#f88;padding:20px">Chunk load error: '+e.message+'</pre>';
  });
})();
</script>
</body>
</html>
