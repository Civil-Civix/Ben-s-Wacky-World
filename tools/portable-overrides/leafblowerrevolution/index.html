<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Leaf Blower Revolution</title>
<link rel="icon" href="favicon.ico">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101010}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100vw;height:100vh;max-width:100vw;max-height:100vh;object-fit:contain;outline:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:16px system-ui;background:#101010;z-index:-1}
</style>
</head>
<body>
<div id="loading">Loading Leaf Blower Revolution…</div>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
var gameRuntimeDir = 'js/';
var Module = {
  canvas: document.getElementById('canvas'),
  locateFile: function(path) { return path === 'game.unx' ? window.gameun : gameRuntimeDir + path; },
  setStatus: function(text) {
    if (text) document.title = text + ' — Leaf Blower Revolution';
    else document.title = 'Leaf Blower Revolution';
  },
  monitorRunDependencies: function(left) {
    if (left === 0) {
      var el = document.getElementById('loading');
      if (el) el.remove();
      document.title = 'Leaf Blower Revolution';
    }
  }
};
window.addEventListener('error', function(e) {
  console.error('Game startup error:', e.message, e.filename, e.lineno);
});
</script>
<script>
// Standalone fallback: GX normally supplies these manifest helpers.
// This archive uses the legacy runner and has no separate manifest list.
window.manifestFiles = window.manifestFiles || function(){ return ''; };
window.manifestFilesMD5 = window.manifestFilesMD5 || function(){ return []; };
var manifestFiles = window.manifestFiles;
var manifestFilesMD5 = window.manifestFilesMD5;

// GameMaker runner callbacks. The wasm calls these setters at startup
// (normally defined by the stock GameMaker index.html). Without them the
// runner dies with "setAddAsyncMethod is not defined".
var g_pAddAsyncMethod = -1;
function setAddAsyncMethod(_function) { g_pAddAsyncMethod = _function; }
var g_pWadLoadCallback = null; // runner does `g_pWadLoadCallback && g_pWadLoadCallback(...)`, so must be falsy until set
function setWadLoadCallback(_function) { g_pWadLoadCallback = _function; }
</script>
<script>
(async function(){
 try {
  const chunks=await Promise.all([1,2,3].map(async n=>{const r=await fetch('game.unx.part'+n);if(!r.ok)throw Error('Game download failed ('+r.status+')');return r.arrayBuffer();}));
  window.gameun=URL.createObjectURL(new Blob(chunks,{type:'application/octet-stream'}));
  const originalFetch=window.fetch;window.fetch=function(input,options){const url=typeof input==='string'?input:input.url;if(/(?:^|\/)game\.unx(?:[?#]|$)/.test(url))input=window.gameun;return originalFetch.call(this,input,options);};
  const originalOpen=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(method,url,...args){if(/(?:^|\/)game\.unx(?:[?#]|$)/.test(url))url=window.gameun;return originalOpen.call(this,method,url,...args);};
  const script=document.createElement('script');script.src='js/runner.js';document.body.appendChild(script);
 } catch(error){document.getElementById('loading').textContent=error.message+' — reload to try again.';}
})();
</script>
</body>
</html>
